<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="hello-page" aria-label="Hello World">
        <div class="floating-guy-track floating-guy-track-1" role="img" aria-label="Draggable floating portrait"><img class="floating-guy" src="bouncing-image.png" alt="" draggable="false"></div>
        <div class="floating-guy-track floating-guy-track-2" role="img" aria-label="Draggable floating portrait"><img class="floating-guy" src="bouncing-image.png" alt="" draggable="false"></div>
        <div class="floating-guy-track floating-guy-track-3" role="img" aria-label="Draggable floating portrait"><img class="floating-guy" src="bouncing-image.png" alt="" draggable="false"></div>
        <div class="floating-guy-track floating-guy-track-4" role="img" aria-label="Draggable floating portrait"><img class="floating-guy" src="bouncing-image.png" alt="" draggable="false"></div>
        <div class="floating-guy-track floating-guy-track-5" role="img" aria-label="Draggable floating portrait"><img class="floating-guy" src="bouncing-image.png" alt="" draggable="false"></div>
        <div class="floating-guy-track floating-guy-track-6" role="img" aria-label="Draggable floating portrait"><img class="floating-guy" src="bouncing-image.png" alt="" draggable="false"></div>
        <div class="hello-content">
            <h1 class="hello-heading">ZACHARY SPARKS</h1>
            <p id="birthday" class="birthday">Birthday: February 9, 2011</p>
        </div>
    </main>
    <script>
        const configs = [
            { x: 24, y: 48, velocityX: 1.4, velocityY: 1.1 },
            { x: 270, y: 36, velocityX: -1.1, velocityY: 1.35 },
            { x: 540, y: 580, velocityX: 1.25, velocityY: -1.2 },
            { x: 820, y: 80, velocityX: -1.35, velocityY: 1.05 },
            { x: 1030, y: 560, velocityX: -1.15, velocityY: -1.3 },
            { x: 720, y: 620, velocityX: 1.05, velocityY: -1.4 }
        ];
        const tracks = [...document.querySelectorAll('.floating-guy-track')];
        const images = tracks.map((track) => track.querySelector('img'));
        const clamp = (value, minimum, maximum) => Math.max(minimum, Math.min(value, maximum));
        let physics = [];
        let drag = null;

        const keepInsideViewport = (guy) => {
            const maxX = Math.max(0, window.innerWidth - guy.width);
            const maxY = Math.max(0, window.innerHeight - guy.height);
            if (guy.x <= 0 || guy.x >= maxX) {
                guy.x = clamp(guy.x, 0, maxX);
                guy.velocityX *= -1;
            }
            if (guy.y <= 0 || guy.y >= maxY) {
                guy.y = clamp(guy.y, 0, maxY);
                guy.velocityY *= -1;
            }
        };

        const separateGuys = () => {
            for (let first = 0; first < physics.length; first += 1) {
                for (let second = first + 1; second < physics.length; second += 1) {
                    const a = physics[first];
                    const b = physics[second];
                    const differenceX = b.x + b.width / 2 - (a.x + a.width / 2);
                    const differenceY = b.y + b.height / 2 - (a.y + a.height / 2);
                    const distance = Math.hypot(differenceX, differenceY) || 0.001;
                    const minimumDistance = a.radius + b.radius;
                    if (distance >= minimumDistance) continue;
                    const normalX = differenceX / distance;
                    const normalY = differenceY / distance;
                    const overlap = minimumDistance - distance;
                    if (a.isDragging && !b.isDragging) {
                        b.x += normalX * overlap;
                        b.y += normalY * overlap;
                    } else if (!a.isDragging && b.isDragging) {
                        a.x -= normalX * overlap;
                        a.y -= normalY * overlap;
                    } else {
                        a.x -= normalX * overlap / 2;
                        a.y -= normalY * overlap / 2;
                        b.x += normalX * overlap / 2;
                        b.y += normalY * overlap / 2;
                    }
                    const relativeVelocity = (b.velocityX - a.velocityX) * normalX + (b.velocityY - a.velocityY) * normalY;
                    if (relativeVelocity < 0 && !a.isDragging && !b.isDragging) {
                        a.velocityX += relativeVelocity * normalX;
                        a.velocityY += relativeVelocity * normalY;
                        b.velocityX -= relativeVelocity * normalX;
                        b.velocityY -= relativeVelocity * normalY;
                    }
                }
            }
        };

        const startMotion = () => {
            physics = configs.map((config, index) => {
                const rect = tracks[index].getBoundingClientRect();
                return { ...config, width: rect.width, height: rect.height, radius: Math.max(rect.width, rect.height) / 2, isDragging: false };
            });
            let previousTime = performance.now();
            const moveGuys = (currentTime) => {
                const elapsed = Math.min((currentTime - previousTime) / 16.67, 2);
                previousTime = currentTime;
                physics.forEach((guy) => {
                    if (!guy.isDragging) {
                        guy.x += guy.velocityX * elapsed;
                        guy.y += guy.velocityY * elapsed;
                    }
                    keepInsideViewport(guy);
                });
                separateGuys();
                physics.forEach(keepInsideViewport);
                physics.forEach((guy, index) => {
                    tracks[index].style.transform = "translate3d(" + guy.x + "px, " + guy.y + "px, 0)";
                });
                requestAnimationFrame(moveGuys);
            };
            requestAnimationFrame(moveGuys);
        };

        Promise.all(images.map((image) => image.complete ? Promise.resolve() : new Promise((resolve) => image.addEventListener('load', resolve, { once: true })))).then(startMotion);

        tracks.forEach((track, index) => {
            track.addEventListener('pointerdown', (event) => {
                const guy = physics[index];
                if (!guy) return;
                const rect = track.getBoundingClientRect();
                drag = { index, pointerId: event.pointerId, offsetX: event.clientX - rect.left, offsetY: event.clientY - rect.top, lastX: event.clientX, lastY: event.clientY, lastTime: performance.now() };
                guy.isDragging = true;
                guy.velocityX = 0;
                guy.velocityY = 0;
                track.setPointerCapture(event.pointerId);
                track.classList.add('is-dragging');
                event.preventDefault();
            });
            track.addEventListener('pointermove', (event) => {
                if (!drag || drag.index !== index || drag.pointerId !== event.pointerId) return;
                const guy = physics[index];
                const now = performance.now();
                const elapsed = Math.max(8, now - drag.lastTime);
                guy.x = clamp(event.clientX - drag.offsetX, 0, Math.max(0, window.innerWidth - guy.width));
                guy.y = clamp(event.clientY - drag.offsetY, 0, Math.max(0, window.innerHeight - guy.height));
                guy.velocityX = clamp((event.clientX - drag.lastX) / elapsed * 16.67, -20, 20);
                guy.velocityY = clamp((event.clientY - drag.lastY) / elapsed * 16.67, -20, 20);
                drag.lastX = event.clientX;
                drag.lastY = event.clientY;
                drag.lastTime = now;
            });
            const release = (event) => {
                if (!drag || drag.index !== index || drag.pointerId !== event.pointerId) return;
                const guy = physics[index];
                guy.isDragging = false;
                guy.velocityX = clamp(guy.velocityX * 1.25, -20, 20);
                guy.velocityY = clamp(guy.velocityY * 1.25, -20, 20);
                drag = null;
                track.classList.remove('is-dragging');
                if (track.hasPointerCapture(event.pointerId)) track.releasePointerCapture(event.pointerId);
            };
            track.addEventListener('pointerup', release);
            track.addEventListener('pointercancel', release);
        });

        document.getElementById('birthday').addEventListener('click', () => window.open('https://youtube.com', '_blank'));
    </script>
</body>
</html>
