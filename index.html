<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .floating-guy-track { display: grid; justify-items: center; }
        .guy-hp { color: #294743; font: 12px/1.2 monospace; -webkit-text-stroke: 0; }
        .game-object { position: fixed; top: 0; left: 0; pointer-events: none; border-radius: 50%; }
        .health-ball { width: 18px; height: 18px; z-index: 1; border: 2px solid #fff7cf; background: #54b86b; box-shadow: 0 0 14px #b9f29b; }
        .blue-ball { width: 28px; height: 28px; z-index: 2; border: 2px solid #d8f0ff; background: #1874df; box-shadow: 0 0 18px #3f97ff; }
        .black-hazard { z-index: 4; background: #050505; box-shadow: 0 4px 12px #0008; }
        .wall { position: fixed; z-index: 3; background: repeating-linear-gradient(45deg, #738783 0 5px, #566b67 5px 10px); border: 1px solid #445552; }
        .flyer { z-index: 2; border-radius: 65% 35%; box-shadow: 0 0 6px currentColor; }
        .floating-guy-track-7 { width: clamp(4rem, 7.5vw, 5.75rem); filter: hue-rotate(325deg); }
        .floating-guy-track-8 { width: clamp(4.5rem, 8vw, 6.25rem); filter: hue-rotate(75deg); }
        .floating-guy-track-9 { width: clamp(5rem, 8.5vw, 6.75rem); filter: hue-rotate(195deg); }
        .floating-guy-track-10 { width: clamp(4.25rem, 7vw, 5.5rem); filter: hue-rotate(250deg); }
    </style>
</head>
<body>
    <main class="hello-page" aria-label="Hello World">
        <div class="hello-content">
            <h1 class="hello-heading">ZACHARY SPARKS</h1>
            <p id="birthday" class="birthday">Birthday: February 9, 2011</p>
        </div>
    </main>

    <script>
        // Everything is kept in this readable file so the repository stays easy to edit.
        const page = document.querySelector('.hello-page');
        const clamp = (value, min, max) => Math.max(min, Math.min(value, max));
        const random = (min, max) => min + Math.random() * (max - min);
        const hpSpeed = (hp) => Math.pow(1.08, hp / 30);
        const guyStarts = [
            [24, 48, 1.4, 1.1], [270, 36, -1.1, 1.35], [540, 580, 1.25, -1.2],
            [820, 80, -1.35, 1.05], [1030, 560, -1.15, -1.3], [720, 620, 1.05, -1.4],
            [130, 360, 1.3, -1.15], [410, 220, -1.2, 1.25], [930, 330, 1.1, 1.3],
            [620, 120, -1.35, -1.05]
        ];
        const healthStarts = [
            [.08,.22,.7,.45], [.2,.78,-.55,.65], [.35,.16,.5,-.7], [.48,.72,-.75,-.4],
            [.61,.28,.6,.55], [.74,.82,-.45,-.7], [.86,.18,-.65,.5], [.92,.62,.55,-.6],
            [.14,.42,.45,-.55], [.28,.55,-.6,.5], [.42,.36,.65,.4], [.56,.12,-.5,.7],
            [.67,.58,.55,-.5], [.79,.37,-.7,.45], [.9,.9,.4,-.65], [.05,.88,-.55,.6]
        ];
        const guys = [];
        const greenBalls = [];
        const blueBalls = [];
        const hazards = [];
        const walls = [];
        const burstBalls = [];
        const flyers = [];
        const hardHitTimes = new Map();

        function makeElement(className, parent = page) {
            const element = document.createElement('div');
            element.className = className;
            parent.appendChild(element);
            return element;
        }

        function place(object) {
            object.element.style.transform = `translate3d(${object.x}px, ${object.y}px, 0)`;
        }

        // Ten draggable guys.
        guyStarts.forEach(([x, y, velocityX, velocityY], index) => {
            const element = makeElement(`floating-guy-track floating-guy-track-${index + 1}`);
            element.innerHTML = '<img class="floating-guy" src="bouncing-image.png" alt="" draggable="false"><span class="guy-hp">hp:0</span>';
            guys.push({ element, hpLabel: element.querySelector('.guy-hp'), x, y, velocityX, velocityY, hp: 0, width: 90, height: 140, radius: 70, dragging: false });
        });

        // Sixteen moving green balls worth 30 HP.
        healthStarts.forEach(([xRatio, yRatio, velocityX, velocityY]) => {
            const ball = { element: makeElement('game-object health-ball'), x: xRatio * innerWidth, y: yRatio * innerHeight, velocityX, velocityY, size: 18, radius: 9 };
            greenBalls.push(ball);
        });

        // Fourteen harmless flyers that seek the three lowest-HP guys.
        const flyerColors = ['#fff4a8', '#ff9f74', '#d79bff', '#72e4de'];
        for (let index = 0; index < 14; index += 1) {
            const size = 7 + index % 4 * 2;
            const element = makeElement('game-object flyer');
            element.style.cssText += `width:${size}px;height:${size}px;color:${flyerColors[index % 4]};background:currentColor`;
            flyers.push({ element, size, x: random(0, innerWidth), y: random(0, innerHeight), velocityX: random(-2, 2), velocityY: random(-2, 2), phase: random(0, Math.PI * 2) });
        }

        function updateHp(guy) {
            guy.hpLabel.textContent = `hp:${Math.round(guy.hp)}`;
            guy.element.setAttribute('aria-label', `Draggable floating portrait, ${Math.round(guy.hp)} health points`);
        }

        function keepOnScreen(object) {
            const maxX = Math.max(0, innerWidth - object.width);
            const maxY = Math.max(0, innerHeight - object.height);
            if (object.x <= 0 || object.x >= maxX) {
                object.x = clamp(object.x, 0, maxX);
                object.velocityX *= -1;
            }
            if (object.y <= 0 || object.y >= maxY) {
                object.y = clamp(object.y, 0, maxY);
                object.velocityY *= -1;
            }
        }

        function respawnBall(ball) {
            ball.x = random(0, Math.max(0, innerWidth - ball.size));
            ball.y = random(0, Math.max(0, innerHeight - ball.size));
        }

        function separateGuys(now) {
            for (let first = 0; first < guys.length; first += 1) {
                for (let second = first + 1; second < guys.length; second += 1) {
                    const a = guys[first], b = guys[second];
                    const dx = b.x + b.width / 2 - (a.x + a.width / 2);
                    const dy = b.y + b.height / 2 - (a.y + a.height / 2);
                    const distance = Math.hypot(dx, dy) || .001;
                    const minimum = a.radius + b.radius;
                    if (distance >= minimum) continue;
                    const nx = dx / distance, ny = dy / distance;
                    const overlap = minimum - distance;
                    a.x -= nx * overlap / 2; a.y -= ny * overlap / 2;
                    b.x += nx * overlap / 2; b.y += ny * overlap / 2;
                    const closingSpeed = -((b.velocityX * hpSpeed(b.hp) - a.velocityX * hpSpeed(a.hp)) * nx + (b.velocityY * hpSpeed(b.hp) - a.velocityY * hpSpeed(a.hp)) * ny);
                    const key = `${first}-${second}`;
                    if (closingSpeed >= 7.5 && now - (hardHitTimes.get(key) || 0) > 650) {
                        a.hp -= 30; b.hp -= 30; updateHp(a); updateHp(b); hardHitTimes.set(key, now);
                    }
                    const relative = (b.velocityX - a.velocityX) * nx + (b.velocityY - a.velocityY) * ny;
                    if (relative < 0 && !a.dragging && !b.dragging) {
                        a.velocityX += relative * nx; a.velocityY += relative * ny;
                        b.velocityX -= relative * nx; b.velocityY -= relative * ny;
                    }
                }
            }
        }

        function collectGreenBalls(elapsed) {
            [...greenBalls, ...burstBalls].forEach((ball) => {
                ball.x += ball.velocityX * elapsed;
                ball.y += ball.velocityY * elapsed;
                ball.width = ball.height = ball.size;
                keepOnScreen(ball);
                for (const guy of guys) {
                    if (Math.hypot(ball.x + ball.radius - (guy.x + guy.width / 2), ball.y + ball.radius - (guy.y + guy.height / 2)) < guy.radius + ball.radius) {
                        guy.hp += 30; updateHp(guy);
                        if (greenBalls.includes(ball)) respawnBall(ball);
                        else {
                            ball.element.remove();
                            burstBalls.splice(burstBalls.indexOf(ball), 1);
                        }
                        break;
                    }
                }
                place(ball);
            });
        }

        function spawnBlueBallsIfNeeded(now) {
            guys.forEach((guy) => {
                if (guy.boostEnds && now >= guy.boostEnds) {
                    guy.hp = guy.savedHp; delete guy.savedHp; delete guy.boostEnds; updateHp(guy);
                }
            });
            const lowCount = guys.filter((guy) => guy.hp < -100).length;
            if (lowCount >= 3 && blueBalls.length === 0) {
                for (let index = 0; index < 3; index += 1) {
                    const ball = { element: makeElement('game-object blue-ball'), x: random(20, innerWidth - 48), y: random(20, innerHeight - 48), size: 28, radius: 14 };
                    blueBalls.push(ball); place(ball);
                }
            } else if (lowCount < 3) {
                blueBalls.splice(0).forEach((ball) => ball.element.remove());
            }
            for (const guy of guys) {
                const hit = blueBalls.find((ball) => Math.hypot(ball.x + 14 - (guy.x + guy.width / 2), ball.y + 14 - (guy.y + guy.height / 2)) < guy.radius + 14);
                if (!hit) continue;
                if (guy.savedHp === undefined) guy.savedHp = guy.hp;
                guy.hp = 3000; guy.boostEnds = now + 3000; updateHp(guy);
                hit.element.remove(); blueBalls.splice(blueBalls.indexOf(hit), 1);
                break;
            }
        }

        function moveFlyers(elapsed, now) {
            const slowest = guys.map((guy, index) => ({ guy, index })).sort((a, b) => a.guy.hp - b.guy.hp).slice(0, 3);
            flyers.forEach((flyer, index) => {
                const target = slowest[index % slowest.length].guy;
                const dx = target.x + target.width / 2 - flyer.x;
                const dy = target.y + target.height / 2 - flyer.y;
                const distance = Math.hypot(dx, dy) || 1;
                const wobble = Math.sin(now / 260 + flyer.phase) * .08;
                flyer.velocityX += (dx / distance - dy / distance * wobble) * .045 * elapsed;
                flyer.velocityY += (dy / distance + dx / distance * wobble) * .045 * elapsed;
                const speed = Math.hypot(flyer.velocityX, flyer.velocityY);
                if (speed > 3.8) { flyer.velocityX *= 3.8 / speed; flyer.velocityY *= 3.8 / speed; }
                flyer.x += flyer.velocityX * elapsed; flyer.y += flyer.velocityY * elapsed;
                flyer.width = flyer.height = flyer.size; keepOnScreen(flyer);
                flyer.element.style.transform = `translate3d(${flyer.x}px,${flyer.y}px,0) rotate(${Math.atan2(flyer.velocityY, flyer.velocityX)}rad)`;
            });
        }

        function spawnWall() {
            const horizontal = Math.random() < .5;
            const wall = {
                element: makeElement('wall'), x: random(30, innerWidth - 250), y: random(30, innerHeight - 250),
                width: horizontal ? random(120, 260) : 10, height: horizontal ? 10 : random(120, 260),
                expires: performance.now() + random(3000, 10000), hits: 0
            };
            wall.element.style.cssText += `left:${wall.x}px;top:${wall.y}px;width:${wall.width}px;height:${wall.height}px`;
            walls.push(wall);
        }
        setInterval(spawnWall, 5000);

        function collideGuyWithWalls(guy) {
            walls.forEach((wall) => {
                const overlaps =
                    guy.x < wall.x + wall.width &&
                    guy.x + guy.width > wall.x &&
                    guy.y < wall.y + wall.height &&
                    guy.y + guy.height > wall.y;
                if (!overlaps) return;

                const moveLeft = guy.x + guy.width - wall.x;
                const moveRight = wall.x + wall.width - guy.x;
                const moveUp = guy.y + guy.height - wall.y;
                const moveDown = wall.y + wall.height - guy.y;
                const smallestMove = Math.min(moveLeft, moveRight, moveUp, moveDown);
                const impactSpeed = Math.hypot(
                    guy.velocityX * hpSpeed(guy.hp),
                    guy.velocityY * hpSpeed(guy.hp)
                );

                if (smallestMove === moveLeft) {
                    guy.x -= moveLeft;
                    guy.velocityX = -Math.abs(guy.velocityX);
                } else if (smallestMove === moveRight) {
                    guy.x += moveRight;
                    guy.velocityX = Math.abs(guy.velocityX);
                } else if (smallestMove === moveUp) {
                    guy.y -= moveUp;
                    guy.velocityY = -Math.abs(guy.velocityY);
                } else {
                    guy.y += moveDown;
                    guy.velocityY = Math.abs(guy.velocityY);
                }

                if (impactSpeed >= 7.5) wall.hits += 1;
            });
        }

        function processWalls(now) {
            walls.slice().forEach((wall) => {
                if (now < wall.expires && wall.hits < 40) return;
                if (wall.hits >= 40) {
                    for (let index = 0; index < 200; index += 1) {
                        const size = 8;
                        const ball = { element: makeElement('game-object health-ball'), x: wall.x, y: wall.y, velocityX: random(-4, 4), velocityY: random(-4, 4), size, radius: 4 };
                        ball.element.style.width = ball.element.style.height = `${size}px`; burstBalls.push(ball);
                    }
                }
                wall.element.remove(); walls.splice(walls.indexOf(wall), 1);
            });
        }

        function activateHazards() {
            if (!guys.some((guy) => guy.hp > 1500) || hazards.length) return;
            for (let index = 0; index < 3; index += 1) {
                const size = 42;
                const hazard = { element: makeElement('game-object black-hazard'), x: random(0, innerWidth - size), y: random(0, innerHeight - size), velocityX: random(-2, 2), velocityY: random(-2, 2), size, radius: size / 2, damage: 1000 };
                hazard.element.style.width = hazard.element.style.height = `${size}px`; hazards.push(hazard);
            }
        }

        function moveHazards(elapsed) {
            activateHazards();
            hazards.slice().forEach((hazard) => {
                hazard.x += hazard.velocityX * elapsed; hazard.y += hazard.velocityY * elapsed;
                hazard.width = hazard.height = hazard.size; keepOnScreen(hazard); place(hazard);
                for (const guy of guys) {
                    if (Math.hypot(hazard.x + hazard.radius - (guy.x + guy.width / 2), hazard.y + hazard.radius - (guy.y + guy.height / 2)) >= guy.radius + hazard.radius) continue;
                    guy.hp -= hazard.damage; updateHp(guy);
                    if (hazard.damage === 1000) {
                        for (let index = 0; index < 4; index += 1) {
                            const size = 16;
                            const shard = { element: makeElement('game-object black-hazard'), x: hazard.x, y: hazard.y, velocityX: Math.cos(index * Math.PI / 2) * 3, velocityY: Math.sin(index * Math.PI / 2) * 3, size, radius: 8, damage: 30 };
                            shard.element.style.width = shard.element.style.height = `${size}px`; hazards.push(shard);
                        }
                    }
                    hazard.element.remove(); hazards.splice(hazards.indexOf(hazard), 1); break;
                }
            });
        }

        // Dragging and fling velocity.
        let drag = null;
        guys.forEach((guy, index) => {
            guy.element.addEventListener('pointerdown', (event) => {
                const rect = guy.element.getBoundingClientRect();
                drag = { guy, index, id: event.pointerId, offsetX: event.clientX - rect.left, offsetY: event.clientY - rect.top, lastX: event.clientX, lastY: event.clientY, lastTime: performance.now() };
                guy.dragging = true; guy.velocityX = guy.velocityY = 0;
                guy.element.setPointerCapture(event.pointerId); guy.element.classList.add('is-dragging');
            });
            guy.element.addEventListener('pointermove', (event) => {
                if (!drag || drag.guy !== guy || drag.id !== event.pointerId) return;
                const now = performance.now(), elapsed = Math.max(8, now - drag.lastTime);
                guy.x = event.clientX - drag.offsetX; guy.y = event.clientY - drag.offsetY;
                guy.velocityX = clamp((event.clientX - drag.lastX) / elapsed * 16.67, -20, 20);
                guy.velocityY = clamp((event.clientY - drag.lastY) / elapsed * 16.67, -20, 20);
                drag.lastX = event.clientX; drag.lastY = event.clientY; drag.lastTime = now;
            });
            const release = (event) => {
                if (!drag || drag.guy !== guy || drag.id !== event.pointerId) return;
                guy.dragging = false; guy.velocityX *= 1.25; guy.velocityY *= 1.25;
                drag = null; guy.element.classList.remove('is-dragging');
            };
            guy.element.addEventListener('pointerup', release);
            guy.element.addEventListener('pointercancel', release);
        });

        // Randomly push one guy toward the center every 2.2-6 seconds.
        function scheduleCenterPush() {
            setTimeout(() => {
                const candidates = guys.filter((guy) => !guy.dragging);
                const guy = candidates[Math.floor(Math.random() * candidates.length)];
                const dx = innerWidth / 2 - (guy.x + guy.width / 2);
                const dy = innerHeight / 2 - (guy.y + guy.height / 2);
                const distance = Math.hypot(dx, dy) || 1;
                guy.velocityX += dx / distance * random(2.5, 5);
                guy.velocityY += dy / distance * random(2.5, 5);
                scheduleCenterPush();
            }, random(2200, 6000));
        }
        scheduleCenterPush();

        Promise.all([...document.images].map((image) => image.complete ? Promise.resolve() : new Promise((resolve) => image.addEventListener('load', resolve, { once: true })))).then(() => {
            guys.forEach((guy) => {
                guy.width = guy.element.offsetWidth; guy.height = guy.element.offsetHeight; guy.radius = Math.max(guy.width, guy.height) / 2;
            });
            let previous = performance.now();
            function animate(now) {
                const elapsed = Math.min((now - previous) / 16.67, 2); previous = now;
                guys.forEach((guy) => {
                    if (!guy.dragging) {
                        const speed = hpSpeed(guy.hp);
                        guy.x += guy.velocityX * speed * elapsed; guy.y += guy.velocityY * speed * elapsed;
                    }
                    collideGuyWithWalls(guy);
                    keepOnScreen(guy); place(guy);
                });
                separateGuys(now);
                collectGreenBalls(elapsed);
                spawnBlueBallsIfNeeded(now);
                moveHazards(elapsed);
                moveFlyers(elapsed, now);
                processWalls(now);
                requestAnimationFrame(animate);
            }
            requestAnimationFrame(animate);
        });

        document.getElementById('birthday').addEventListener('click', () => window.open('https://youtube.com', '_blank', 'noopener,noreferrer'));
    </script>
</body>
</html>
